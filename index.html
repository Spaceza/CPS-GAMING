<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Teste de Cliques</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>

<body class="bg-dark text-light text-center p-5">

    <div class="container">
        <h1 class="text-success mb-4">CPS Gaming</h1>

        <!-- Input De Nome -->
        <form class="mb-4" id="formulario">
            <div class="digite_nome mb-3">
                <label for="nome" class="form-label">Digite seu nome:</label>
                <input type="text" id="nome" name="nome" class="form-control w-50 mx-auto" placeholder="Ex: JogadorBR">
            </div>

            <!-- Modo / Dificuldae / Tempo Desejado -->
            <div class="mb-3" id="dificuldade">
                <label for="modo" class="form-label">Selecione o modo de jogo:</label>
                <select id="modo" class="form-select w-50 mx-auto">
                    <option value="15">🐢 Fácil (15s)</option>
                    <option value="0">⚖️ Normal (10s)</option>
                    <option value="5">🔥 Difícil (5s)</option>
                    <option value="3">💀 Insano (3s)</option>
                    <option value="1">☠️ Impossível (1s)</option>
                </select>
        </form>

        <!-- Placar -->
        <div id="placar" class="mb-4 d-flex justify-content-center gap-4">
            <p><strong>Tempo:</strong> <span id="tempo">0</span> segundos</p>
            <p><strong>Cliques:</strong> <span id="cliques">0</span></p>
            <p><strong>CPS:</strong> <span id="cps">0</span></p>
        </div>

        <!-- Botões -->
        <div class="botoes">
            <button type="button" class="btn btn-success" id="botao_iniciar_jogo" onclick="iniciarJogo()">Iniciar</button>
            <button type="button" class="btn btn-danger" id="botao_reiniciar" onclick="reiniciarJogo()">Reiniciar</button>
            <button type="button" class="btn btn-primary" id="botao_salvar" onclick="salvarResultado()" disabled>Salvar</button>
        </div>

        <!-- Rankign -->
        <div id="ranking" class="mt-4">
            <h2 class="text-success">Ranking</h2>
            <ul id="lista-ranking" class="list-group w-50 mx-auto text-success"></ul>
        </div>

        <div id="resultado" class="mb-3 text-success" style="display: none; font-size: 1.2rem;">
            <!-- Mensagem de resultado será exibida aqui -->
        </div>
    </div>
    <!-- Conagem Regressiva -->
    <p id="contagem-regressiva" class="display-4 text-success" style="display: none;">3</p>

    <!-- Area De Clique -->
    <div id="area-jogo" onclick="registrarClique()">
        Clique aqui o mais rápido que puder!
    </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
